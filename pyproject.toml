[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mem"
version = "0.1.0"
description = "Memory for AI agents as record files in the repo: a stdlib CLI, hooks and a Claude Code plugin."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Istvan Lovas"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
mem = "ai_mem.mem_cli:main"
mem-dream = "ai_mem.dream_cli:main"
mem-adr-sync = "ai_mem.adr_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_mem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
